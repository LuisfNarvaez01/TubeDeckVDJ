name: Build & Publish Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-win:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx vitest run

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Download official yt-dlp binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "resources/bin" | Out-Null
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "resources/bin/yt-dlp.exe" -UseBasicParsing

      - name: Build Electron bundle
        run: npm run build

      - name: Package Windows NSIS Installer
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis --publish never

      - name: Publish Single Atomic GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$ver"
          $setupSrc = "dist/TubeDeck VDJ Setup $ver.exe"
          $blockSrc = "dist/TubeDeck VDJ Setup $ver.exe.blockmap"
          $setupDest = "dist/TubeDeck-VDJ-Setup-$ver.exe"
          $blockDest = "dist/TubeDeck-VDJ-Setup-$ver.exe.blockmap"
          Copy-Item $setupSrc $setupDest -Force
          Copy-Item $blockSrc $blockDest -Force
          gh release create $tag "dist/latest.yml" $setupDest $blockDest --title "TubeDeck VDJ $tag" --latest --generate-notes
