appId: com.tubedeck.vdj
productName: Lantify Proyecta
# The app calls itself Proyecta inside; Windows lists it as Lantify Proyecta. Keep the exe name.
executableName: Proyecta
copyright: Copyright © Lantify
directories:
  output: dist
  buildResources: build
asar: true
asarUnpack:
  - "**/*.node"
files:
  - out/**/*
  - package.json
  - "!src/**"
  - "!tests/**"
  - "!docs/**"
  - "!test-results/**"
  - "!playwright-report/**"
  - "!build/**"
  - "!*.config.*"
  - "!tsconfig*.json"
extraResources:
  - from: node_modules/sql.js/dist/sql-wasm.wasm
    to: sql-wasm.wasm
  - from: resources/bin
    to: bin
    filter:
      - "**/*"
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Lantify Proyecta
  uninstallDisplayName: Lantify Proyecta
  artifactName: Proyecta-Setup-${version}.${ext}
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
publish:
  - provider: github
    owner: LuisfNarvaez01
    repo: TubeDeckVDJ
    releaseType: release

